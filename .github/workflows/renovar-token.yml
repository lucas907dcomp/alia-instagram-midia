name: Renovar token do Instagram
# O token do Instagram vale 60 dias. Renovar toda semana e regravar token.enc (criptografado com TOKEN_KEY).
on:
  schedule:
    - cron: '0 11 * * 1'   # segunda, 08:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency: fila
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renovar e regravar
        env:
          KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          t=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass "pass:$KEY" < token.enc)
          echo "::add-mask::$t"
          resp=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$t")
          novo=$(echo "$resp" | jq -r .access_token)
          echo "::add-mask::$novo"
          echo "Token renovado, vale mais $(( $(echo "$resp" | jq -r .expires_in) / 86400 )) dias."
          printf '%s' "$novo" | openssl enc -aes-256-cbc -pbkdf2 -salt -a -A -pass "pass:$KEY" > token.enc
          git config user.name "alia-publicador"
          git config user.email "actions@users.noreply.github.com"
          git add token.enc && git commit -m "Token renovado" && git pull --rebase -q && git push
