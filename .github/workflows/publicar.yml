name: Publicar no Instagram
on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node publicar.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Registrar publicação na fila
        run: |
          git config user.name "alia-publicador"
          git config user.email "actions@users.noreply.github.com"
          git add fila
          git diff --cached --quiet || (git commit -m "Publicado: $(git diff --cached --name-only | head -1 | cut -d/ -f2)" && git push)
