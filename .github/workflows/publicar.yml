name: Publicar no Instagram
on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency: fila
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abrir token
        run: |
          t=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass "pass:${{ secrets.TOKEN_KEY }}" < token.enc)
          echo "::add-mask::$t"
          echo "IG_TOKEN=$t" >> "$GITHUB_ENV"
      - run: node publicar.mjs
      - name: Atualizar métricas
        run: node metricas.mjs
      - name: Registrar publicação na fila
        run: |
          git config user.name "alia-publicador"
          git config user.email "actions@users.noreply.github.com"
          git add fila
          git diff --cached --quiet || (git commit -m "Publicado: $(git diff --cached --name-only | head -1 | cut -d/ -f2)" && git push)
